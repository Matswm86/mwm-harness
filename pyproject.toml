[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mwm-harness"
version = "0.1.0"
description = "MWM Harness: a personal agent harness for Qwen, Kimi and GLM models"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
]

[project.scripts]
mwm = "mwm_harness.cli:main"

[project.optional-dependencies]
web = ["fastapi>=0.110", "uvicorn>=0.29", "websockets>=12"]
dev = ["pytest>=8.0", "ruff>=0.15", "fastapi>=0.110", "uvicorn>=0.29", "websockets>=12"]

[tool.setuptools.packages.find]
include = ["mwm_harness*"]

[tool.setuptools.package-data]
mwm_harness = ["web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
