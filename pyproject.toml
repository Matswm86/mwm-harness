[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mwm-harness"
version = "0.1.0"
description = "MWM Harness: a personal agent harness for Qwen, Kimi and GLM models"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "httpx>=0.27",
]

[project.scripts]
mwm = "mwm_harness.cli:main"
mwm-jev = "mwm_harness.jev:main"
mwm-eval = "mwm_harness.reason_eval:main"

[project.optional-dependencies]
web = ["fastapi>=0.110", "uvicorn>=0.29", "websockets>=12"]
# Panel mic button: local Whisper; the nvidia wheels let it run on a CUDA GPU (about 2 GB)
voice = ["faster-whisper>=1.1", "av<16", "nvidia-cublas-cu12", "nvidia-cudnn-cu12==9.*"]
dev = ["pytest>=8.0", "ruff>=0.15", "coverage>=7.6", "fastapi>=0.110", "uvicorn>=0.29", "websockets>=12"]

[tool.setuptools.packages.find]
include = ["mwm_harness*"]

[tool.setuptools.package-data]
mwm_harness = ["web/static/*", "playbooks/*/SKILL.md", "builtin_agents/*.md", "mods.default.toml", "checks.default.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
