# Model registry for MWM Harness. One entry per model id.
# key_env names the environment variable that holds the API key; the key itself
# lives in ~/.config/mwm-harness/secrets.env (mode 600), never in this repo.
# Quirk flags stay "unverified" until spike/spike_toolcalls.py has measured them
# and COMPAT.md records the result.

[defaults]
base_url = "https://token-plan.ap-southeast-1.maas.aliyuncs.com/compatible-mode/v1"
key_env = "MWM_HARNESS_API_KEY"

[models."qwen3.8-max"]
family = "qwen"
context_window = 1000000
# 40% of the window, matched 2026-10-24 to Qwen Code's context.autoCompactThreshold
# 0.4 in ~/MWM/.qwen/settings.json. It was 200000 here and 0.15 (150k) there, which
# compacted mid-arc: 10 compactions across 5 Qwen Code sessions on 10-24.
soft_budget = 400000
thinking_field = "enable_thinking"
# Measured 2026-10-21: spike/spike_vision.py on the payg twin read the two drawn
# range levels of a gold frame (1.13245 / 1.17879, five decimals, not round axis
# values) exactly, and an interactive read on THIS endpoint confirmed the same
# frame. COMPAT.md has the table.
vision = true

# DEFECT, found 2026-10-24, left unfixed on purpose. These two set soft_budget
# without context_window, so both inherit the 128000 default from config.py and
# their budget sits ABOVE their window: ContextMeter.over_budget can never fire and
# meter.line() prints the fraction against 128k. Real windows per Qwen Code's
# provider registry are 262144 (kimi) and 1000000 (glm-5.2). Neither is in live use
# (~/.config/mwm-harness/settings.toml agent_models maps to qwen3.8-max,
# qwen3.8-flash and glm-5.3 as critic), so a fix today would be an unmeasured guess
# about a model nobody runs. Set context_window explicitly before using either.
[models."kimi-k2.7-code"]
family = "kimi"
soft_budget = 200000

[models."glm-5.2"]
family = "glm"
soft_budget = 200000

# Cheap interactive tier. Verified on the plan key's /models list 2026-10-19, and
# Qwen Code's provider registry gives it a 1,000,000-token window with image and
# video input and the same thinking efforts as qwen3.8-max. This is what the
# light agents run on so the lead model's credits are not spent on searching.
[models."qwen3.8-flash"]
family = "qwen"
context_window = 1000000
# Same 40% as qwen3.8-max: one window, one ratio to remember. The two payg- entries
# below stay at 200000 because that lane is metered per token, so their budget is
# spend per request rather than just context.
soft_budget = 400000
thinking_field = "enable_thinking"
# Measured 2026-10-21 on the payg twin: read the same gold frame's drawn levels
# exactly, four times faster than qwen3.8-max. COMPAT.md has the table.
vision = true

# Different family from Qwen, which is what the critic needs: a model that reviews
# Qwen's work must not share Qwen's blind spots. glm-5.3 is on the plan key's
# /models list, but neither it nor deepseek-v4.1-flash appears in Qwen Code's
# provider registry, so their context windows are UNVERIFIED. Both therefore keep
# the 128k default window and a conservative budget rather than an invented one.
# glm-5.2 above is the sibling with a verified 1,000,000-token window.
[models."glm-5.3"]
family = "glm"
soft_budget = 100000

[models."deepseek-v4.1-flash"]
family = "deepseek"
soft_budget = 100000

# Local models behind Ollama's OpenAI-compatible endpoint. Ollama ignores the
# key, but key_env must hold any non-empty value (OLLAMA_API_KEY=ollama).
# The endpoint cannot take num_ctx per request and Ollama cuts a longer prompt
# SILENTLY at the model's context length (4096 by default; measured 09-20: a
# 7k-token prompt came back as 2050 input tokens). So these ids are 16k
# variants built once with:
#   printf 'FROM qwen3-vl:4b-instruct\nPARAMETER num_ctx 16384\n' > Modelfile
#   ollama create qwen3-vl-4b-instruct-16k -f Modelfile
# Both base models passed the parallel tool-call spike, see COMPAT.md.
[models."qwen3-vl-4b-instruct-16k"]
family = "qwen"
base_url = "http://localhost:11434/v1"
key_env = "OLLAMA_API_KEY"
context_window = 16384
soft_budget = 12000

[models."gemma4-e4b-16k"]
family = "gemma"
base_url = "http://localhost:11434/v1"
key_env = "OLLAMA_API_KEY"
context_window = 16384
soft_budget = 12000

# Ornith-1.5-35B-A3B (DeepReinforce, MIT, Qwen 3.5 MoE base, 3B active per token),
# official Q4_K_M GGUF from ornith-ai/Ornith-1.5-35B-A3B-GGUF, 16k variant built with:
#   printf 'FROM hf.co/ornith-ai/Ornith-1.5-35B-A3B-GGUF:Q4_K_M\nPARAMETER num_ctx 16384\n' > Modelfile
#   ollama create ornith-1.5-35b-16k -f Modelfile
# 21.7 GB, so most layers sit in system RAM on the 6 GB laptop GPU.
[models."ornith-1.5-35b-16k"]
family = "qwen"
base_url = "http://localhost:11434/v1"
key_env = "OLLAMA_API_KEY"
context_window = 16384
soft_budget = 12000

# Spark-X2.5-4B (iFLYTEK SparkLLM, Apache 2.0, 4.1B dense, hybrid sliding-window
# attention), official Q4_K_M GGUF from XHToken/Spark-X2.5-4B-GGUF, 16k variant built with:
#   printf 'FROM hf.co/XHToken/Spark-X2.5-4B-GGUF:Q4_K_M\nPARAMETER num_ctx 16384\n' > Modelfile
#   ollama create spark-x2.5-4b-16k -f Modelfile
[models."spark-x2.5-4b-16k"]
family = "spark"
base_url = "http://localhost:11434/v1"
key_env = "OLLAMA_API_KEY"
context_window = 16384
soft_budget = 12000

# 32k variants of the two models above (both GGUFs support far more: Ornith 262,144,
# Spark 1,048,576). The harness's own system prompt and tool list are about 17,000
# tokens before the first message, so the 16k variants cannot hold a session.
#   printf 'FROM <same GGUF as the 16k variant>\nPARAMETER num_ctx 32768\n' > Modelfile
#   ollama create <name>-32k -f Modelfile
[models."ornith-1.5-35b-32k"]
family = "qwen"
base_url = "http://localhost:11434/v1"
key_env = "OLLAMA_API_KEY"
context_window = 32768
soft_budget = 26000

[models."spark-x2.5-4b-32k"]
family = "spark"
base_url = "http://localhost:11434/v1"
key_env = "OLLAMA_API_KEY"
context_window = 32768
soft_budget = 26000

# Groq hosted inference, OpenAI-compatible. This is the lane for headless `mwm -p`
# callers (Stop gates, the weekly agent audit, the destructive sweep): the Token
# Plan terms reserve that subscription for interactive use inside a tool, so a
# script lane needs a pay-per-token or free hosted backend instead.
# Specs from console.groq.com/docs/model/qwen/qwen3.8-27b, read 2026-10-19:
# 131,072 context, 16,384 max completion, 450 tok/s, image input supported.
# WARNING: Groq lists this id as a PREVIEW model that may be discontinued. It is
# one entry here plus MWM_CLAUDE_REPLACEMENT, so swapping it out is a config edit.
# The id contains a slash because that is the literal model name Groq expects.
# vision stays OFF: the 2026-10-21 spike shows it takes the image and reads the
# price axis in 0.9s, but it missed both drawn range levels of the gold frame,
# so a chart answer from it would look confident and be wrong.
[models."qwen/qwen3.8-27b"]
family = "qwen"
base_url = "https://api.groq.com/openai/v1"
key_env = "GROQ_API_KEY"
context_window = 131072
soft_budget = 100000

# Pay-as-you-go Model Studio, Singapore. Script-permitted, unlike the Token Plan
# entries above, so this is what headless `mwm -p` callers use. The id carries a
# payg- prefix because the model NAME is the same as the Token Plan entry while
# the endpoint and key are different, and the headless guard keys off the host.
# Prices per 1M tokens: flash $0.15 in / $0.47 out, max $2.00 in / $6.00 out.
# Spend is metered and capped by BAILIAN_MONTHLY_BUDGET_USD in core/llm_backends.py.
[models."payg-qwen3.8-flash"]
api_model = "qwen3.8-flash"
family = "qwen"
base_url = "https://dashscope-intl.aliyuncs.com/compatible-mode/v1"
key_env = "BAILIAN_API_KEY"
context_window = 1000000
soft_budget = 200000
thinking_field = "enable_thinking"
# Measured 2026-10-21 by spike/spike_vision.py against this endpoint: gold frame
# r2-d7a82d2e6f5b, 9 of 18 graded values including both drawn range levels read
# exactly, 64s. The cheap lane for headless vision. COMPAT.md has the table.
vision = true

[models."payg-qwen3.8-max"]
api_model = "qwen3.8-max"
family = "qwen"
base_url = "https://dashscope-intl.aliyuncs.com/compatible-mode/v1"
key_env = "BAILIAN_API_KEY"
context_window = 1000000
soft_budget = 200000
thinking_field = "enable_thinking"
# Measured 2026-10-21 by spike/spike_vision.py against this endpoint: both drawn
# range levels of the gold frame read exactly, but 110s to 239s per frame and up
# to 13,586 output tokens of reasoning. Works; flash is the cheaper vision lane.
vision = true
