# Model registry for MWM Harness. One entry per model id.
# key_env names the environment variable that holds the API key; the key itself
# lives in ~/.config/mwm-harness/secrets.env (mode 600), never in this repo.
# Quirk flags stay "unverified" until spike/spike_toolcalls.py has measured them
# and COMPAT.md records the result.

[defaults]
base_url = "https://token-plan.ap-southeast-1.maas.aliyuncs.com/compatible-mode/v1"
key_env = "MWM_HARNESS_API_KEY"

[models."qwen3.8-max"]
family = "qwen"
context_window = 1000000
soft_budget = 200000
thinking_field = "enable_thinking"

[models."kimi-k2.7-code"]
family = "kimi"
soft_budget = 200000

[models."glm-5.2"]
family = "glm"
soft_budget = 200000

# Local models behind Ollama's OpenAI-compatible endpoint. Ollama ignores the
# key, but key_env must hold any non-empty value (OLLAMA_API_KEY=ollama).
# The endpoint cannot take num_ctx per request and Ollama cuts a longer prompt
# SILENTLY at the model's context length (4096 by default; measured 09-20: a
# 7k-token prompt came back as 2050 input tokens). So these ids are 16k
# variants built once with:
#   printf 'FROM qwen3-vl:4b-instruct\nPARAMETER num_ctx 16384\n' > Modelfile
#   ollama create qwen3-vl-4b-instruct-16k -f Modelfile
# Both base models passed the parallel tool-call spike, see COMPAT.md.
[models."qwen3-vl-4b-instruct-16k"]
family = "qwen"
base_url = "http://localhost:11434/v1"
key_env = "OLLAMA_API_KEY"
context_window = 16384
soft_budget = 12000

[models."gemma4-e4b-16k"]
family = "gemma"
base_url = "http://localhost:11434/v1"
key_env = "OLLAMA_API_KEY"
context_window = 16384
soft_budget = 12000
